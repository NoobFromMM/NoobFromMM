<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>NoobFromMM Banner</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #020817;
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .banner {
    position: relative;
    width: 900px;
    height: 180px;
    overflow: hidden;
    background: linear-gradient(115deg, #03172f 0%, #042d45 48%, #0b6f76 100%);
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 900px;
    height: 180px;
  }

  .wave {
    display: inline-block;
    margin-right: 10px;
    color: #facc15;
    font-size: 32px;
    text-shadow:
      0 0 8px rgba(250, 204, 21, 0.45),
      0 1px 2px rgba(0, 0, 0, 0.35);
    animation: none;
    transform-origin: 70% 70%;
  }

  @keyframes wave {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(18deg); }
    40% { transform: rotate(-8deg); }
    60% { transform: rotate(14deg); }
    80% { transform: rotate(-4deg); }
  }

  .hand-wrap {
    display: inline-flex;
    width: 38px;
    height: 38px;
    margin-right: 10px;
    vertical-align: -8px;
    filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.45));
    animation: none;
    transform-origin: 70% 75%;
  }

  .hand-svg {
    width: 38px;
    height: 38px;
    display: block;
  }

  @keyframes handWave {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(15deg); }
    40% { transform: rotate(-6deg); }
    60% { transform: rotate(11deg); }
    80% { transform: rotate(-3deg); }
  }

  .prompt-mark {
    display: inline-block;
    margin-right: 12px;
    color: #22ff99;
    font-weight: 900;
    text-shadow: 0 0 10px rgba(34,255,153,.65);
  }

  .text {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    text-align: center;
    font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: #f4fbff;
    text-shadow:
      0 0 10px rgba(0, 255, 255, 0.35),
      0 2px 8px rgba(0, 0, 0, 0.45);
    white-space: nowrap;
  }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 34px;
    margin-left: 1px;
    vertical-align: -7px;
    background: #22ff99;
    box-shadow: 0 0 12px rgba(34,255,153,.85);
    animation: blink 1.15s steps(1) infinite;
  }

  .inline-cursor {
      display: inline-block;
      width: 2px;
      height: 34px;
      margin: 0;
      vertical-align: -7px;
      background: #22ff99;
      box-shadow: 0 0 12px rgba(34,255,153,.85);
      animation: blink 1.15s steps(1) infinite;
    }

    @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
</style>
</head>
<body>
  <div class="banner">
    <canvas id="net" width="900" height="180"></canvas>
    <div class="text"><span class="prompt-mark">&gt;</span><span id="typed"></span><span class="cursor"></span></div>
  </div>

<script>
const canvas = document.getElementById("net");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

const nodes = [
  [0, 70], [45, 30], [100, 92], [150, 58], [230, 118],
  [310, 75], [390, 35], [470, 88], [555, 55], [635, 108],
  [710, 45], [780, 78], [850, 32], [900, 96],
  [70, 145], [260, 35], [520, 132], [820, 142]
].map((p, i) => ({
  x: p[0],
  y: p[1],
  baseX: p[0],
  baseY: p[1],
  r: i % 4 === 0 ? 4.2 : 2.8,
  phase: i * 0.73,
  glow: i % 3 === 0
}));

function drawNetwork(t) {
  ctx.clearRect(0, 0, W, H);

  // background overlay glow
  const g = ctx.createRadialGradient(W * .82, H * .18, 0, W * .82, H * .18, 420);
  g.addColorStop(0, "rgba(0,255,245,0.18)");
  g.addColorStop(1, "rgba(0,255,245,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // animated positions
  nodes.forEach(n => {
    n.x = n.baseX + Math.sin(t * 0.0007 + n.phase) * 12;
    n.y = n.baseY + Math.cos(t * 0.00055 + n.phase) * 7;
  });

  // lines
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const d = Math.sqrt(dx * dx + dy * dy);

      if (d < 155) {
        const alpha = Math.max(0, 0.55 - d / 280);
        ctx.strokeStyle = `rgba(80,235,255,${alpha})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }
  }

  // nodes
  nodes.forEach(n => {
    if (n.glow) {
      const glow = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 22);
      glow.addColorStop(0, "rgba(0,255,255,0.75)");
      glow.addColorStop(.35, "rgba(0,210,255,0.25)");
      glow.addColorStop(1, "rgba(0,210,255,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(n.x, n.y, 22, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = n.glow ? "rgba(0,255,255,.95)" : "rgba(155,230,245,.85)";
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(drawNetwork);
}

requestAnimationFrame(drawNetwork);

// text animation
const el = document.getElementById("typed");
const outerCursor = document.querySelector(".cursor");

const prefix = "Hi there! I'm ";
const first = "MyatThawMaung";
const insert = "NoobFrom";

const sleep = ms => new Promise(r => setTimeout(r, ms));

function renderEndCursor(text) {
  outerCursor.style.display = "inline-block";
  el.textContent = text;
}

function renderInlineCursor(before, after = "") {
  outerCursor.style.display = "none";
  el.innerHTML = `${before}<span class="cursor inline-cursor"></span>${after}`;
}

async function typeFull(text, speed = 175) {
  for (let i = 1; i <= text.length; i++) {
    renderEndCursor(text.slice(0, i));
    await sleep(speed);
  }
}

async function backspaceStep(from, to, speed = 300) {
  // Cursor stays after the character being deleted, like normal backspace.
  renderEndCursor(prefix + from);
  await sleep(speed);
  renderEndCursor(prefix + to);
  await sleep(speed);
}

async function smartTransform() {
  await sleep(1600);

  // Delete "aung" from the end while keeping the final M.
  const tailSteps = [
    ["MyatThawMaung", "MyatThawMaun"],
    ["MyatThawMaun",  "MyatThawMau"],
    ["MyatThawMau",   "MyatThawMa"],
    ["MyatThawMa",    "MyatThawM"],
  ];

  for (const [from, to] of tailSteps) {
    await backspaceStep(from, to, 260);
  }

  await sleep(700);

  // Delete middle "yatThaw" while keeping M + M.
  let middle = "yatThaw";
  while (middle.length > 0) {
    renderInlineCursor(prefix + "M" + middle, "M");
    await sleep(260);

    middle = middle.slice(0, -1);

    renderInlineCursor(prefix + "M" + middle, "M");
    await sleep(210);
  }

  // Only MM remains. Cursor moves before MM, then types NoobFrom.
  renderInlineCursor(prefix, "MM");
  await sleep(1000);

  let typed = "";
  for (let i = 1; i <= insert.length; i++) {
    typed = insert.slice(0, i);
    renderInlineCursor(prefix + typed, "MM");
    await sleep(210);
  }

  await sleep(900);

  outerCursor.style.display = "inline-block";
  el.innerHTML = `${prefix}${insert}MM`;
}

async function runText() {
  await sleep(900);
  await typeFull(prefix + first, 165);
  await smartTransform();
}

runText();
</script>
</body>
</html>
